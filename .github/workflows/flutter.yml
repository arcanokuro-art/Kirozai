name: Kirozai Android
on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --org com.arcanokuro --platforms=android .
      - run: bash packaging/configure-android.sh
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: kirozai-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
